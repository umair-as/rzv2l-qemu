# The M9 profile's configuration fragment (docs/decisions/DR-0008
# decision 1), merged over smarc-rzv2l_defconfig by build-u-boot-m9.sh.
# Each option, and why. The build fails if the effective .config lacks
# one of these values.
#
# The banner names the profile: U-Boot 2024.07-m9. The source is an
# export of the pinned commit, which has no git metadata for a suffix.
CONFIG_LOCALVERSION="-m9"
# FIT signature checks on the target (the vendor build has only the host
# mkimage's); RSA and SHA-256 come with it.
CONFIG_FIT_SIGNATURE=y
CONFIG_RSA=y
# Two environment copies, so a damaged copy has a defined recovery: the
# second right after the first (0x1F0000 + 0x20000), below partition 1
# at 0x400000 (../sd/uboot-env.py m9-write, run by build-image-m9.sh,
# asserts the bounds).
CONFIG_SYS_REDUNDAND_ENVIRONMENT=y
CONFIG_ENV_OFFSET_REDUND=0x210000
# Only FIT images boot through bootm.
# CONFIG_LEGACY_IMAGE_FORMAT is not set
# `part uuid`: the boot command reads the slot's PARTUUID from the card,
# so the built-in default environment fits any card.
CONFIG_CMD_PART=y
# The built-in default environment is the M9 policy (u-boot-m9.env), not
# the vendor's unsigned boot command. The path is set by the build.
CONFIG_USE_DEFAULT_ENV_FILE=y
# The public key's .dtsi, made by key2dtsi.py, is built into every
# control DTB of CONFIG_OF_LIST. The path is set by the build.

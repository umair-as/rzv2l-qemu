# M2-first-character eval checks (run with: uv run scripts/eval.py m2).
#
# A check is green when its command exits 0 and its `pass` regex matches the
# output. A mutation is red when, with its patch applied to the fork and the
# emulator relinked, its check exits non-zero AND its `red_line` regex
# matches the output. A red from a crash, a timeout or another assertion does
# not count.
#
# Goldens come from the manual (R01UH0936EJ0150, section 22) or the EVK
# evidence file (docs/evidence/EVK-2026-10-29-post-firmware.md), never from
# the model's own output.
#
# kind qtest: `test` is a path in the fork's tests/qtest/rzv2l-scifa-test,
# run against the eval build of qemu-system-aarch64.

checks:
  - id: S01
    kind: qtest
    test: /aarch64/rzv2l-smarc/scif/reset
    proves: every SCIF0-4 register reads its reset value after reset
    golden: SMR 0, BRR = MDDR 0xFF, SCR 0, FSR 0x0020, FCR 0, FDR 0, LSR 0, SEMR 0, FTCR 0x1F1F
    citation: Table 22.4 p.1271
  - id: S02
    kind: qtest
    test: /aarch64/rzv2l-smarc/scif/brr-mddr-bank
    proves: offset 0x02 is MDDR while SEMR.MDDRS = 1 and BRR otherwise, each keeping its value
    golden: BRR write 0x35 not seen through MDDR (0xFF); MDDR write 0xC4 not seen through BRR
    citation: 22.2.8 p.1282, 22.2.9 p.1287
  - id: S03
    kind: qtest
    test: /aarch64/rzv2l-smarc/scif/mddr-write-rule
    proves: MDDR accepts a write only while TE = RE = 0 (all four combinations); bit 7 reads 1
    golden: write ignored for TE/RE = 1/0, 0/1, 1/1; 0x12 reads 0x92
    citation: 22.2.9 p.1287; EVK-R21 (U-Boot's divisor lost on silicon)
  - id: S04
    kind: qtest
    test: /aarch64/rzv2l-smarc/scif/fsr-read-armed
    proves: a 0-write clears an FSR flag only after it was read as 1
    golden: unread 0-write leaves FSR 0x0060; after the read FSR 0x0020 (TDFE set again)
    citation: 22.2.7 p.1278
  - id: S05
    kind: qtest
    test: /aarch64/rzv2l-smarc/scif/tdfe-level
    proves: TDFE is set again right after a clear while the TX count <= trigger; ten FTDR writes leave 9 in the FIFO and clear TDFE
    golden: FSR 0x0060 after the clear; FDR 0x0900, FSR 0 after ten writes
    citation: 22.2.7 p.1280, 22.8.1 p.1327, 22.2.11 p.1292
  - id: S06
    kind: qtest
    test: /aarch64/rzv2l-smarc/scif/tend-deferred
    proves: TEND stays 0 until one frame per byte has passed and then becomes 1, at the programmed format and rate
    golden: 87.08 us (8N1), 3 x 87.08 us, 95.79 us (7E2), 348.32 us (8N1, CKS 1), 174.16 us (8N1, BRR 0x35), +-0.2 us
    citation: 22.2.8 p.1282 and 22.2.9 p.1287 formulas, P0 100 MHz; scif.md section 7; EVK-R23
  - id: S07
    kind: qtest
    test: /aarch64/rzv2l-smarc/scif/tx-trigger
    proves: TDFE follows the TX trigger at count = trigger and trigger + 1, for TTRG 4, TTRG 0 and FTCR.TFTC 2
    golden: TDFE 1 at count = trigger, 0 at trigger + 1
    citation: 22.2.10 p.1290, 22.2.15 p.1299
  - id: S08a
    kind: qtest
    test: /aarch64/rzv2l-smarc/scif/rx-fifo
    proves: RX FIFO count, RDF at the trigger, FRDR pops and clears RDF, RDF set again only above the trigger
    golden: trigger 4, 6 bytes; after one read RDF 1 (5 > 4); after two reads RDF 0 (4), FDR.R 4
    citation: 22.2.7 p.1279, 22.8.2 p.1327
  - id: S08b
    kind: qtest
    test: /aarch64/rzv2l-smarc/scif/rx-dr-timeout
    proves: DR sets 15 bit times after the last byte below the trigger, in 8N1 and 7E2, and clears when drained
    golden: 130.62 us after the byte, +-0.2 us
    citation: '22.2.7 p.1279 (note 1: 1.5 frames only for 8-bit, 1 stop)'
  - id: S09a
    kind: qtest
    test: /aarch64/rzv2l-smarc/scif/irq-txi
    proves: TXI = TIE & TDFE, rising and falling; no other line moves
    golden: equation
    citation: Table 22.19 p.1323
  - id: S09b
    kind: qtest
    test: /aarch64/rzv2l-smarc/scif/irq-rxi
    proves: RXI = RIE & RDF, rising and falling
    golden: equation
    citation: Table 22.19 p.1323
  - id: S09c
    kind: qtest
    test: /aarch64/rzv2l-smarc/scif/irq-tei-dri
    proves: TEI/DRI = (TEIE & TEND) | (RIE & DR), each term alone
    golden: equation; DR at 130.62 us
    citation: Table 22.19 p.1323
  - id: S09d
    kind: qtest
    test: /aarch64/rzv2l-smarc/scif/irq-bri
    proves: BRI = (RIE | REIE) & ORER through a loopback overrun with REIE alone; ERI stays low
    golden: equation
    citation: Table 22.19 p.1323, 22.2.13 p.1296
  - id: S10
    kind: qtest
    test: /aarch64/rzv2l-smarc/scif/undefined-offset
    proves: a 16-bit read at an undefined offset reads 0 without a bus error
    golden: 0x0000 at +0x18
    citation: EVK-R70
  - id: S11
    kind: qtest
    test: /aarch64/rzv2l-smarc/scif/sync-mode-refused
    proves: the SMR write that selects clock synchronous mode is refused (SMR unchanged); the CPU-side abort is A06
    golden: SMR stays 0x0008
    citation: 22.2.5 p.1274; spec decision (c) B
  - id: S12
    kind: qtest
    test: /aarch64/rzv2l-smarc/scif/direct-boot
    proves: with -kernel SCIF0 starts at the post-firmware values and SCIF1-4 at reset
    golden: SMR 0, MDDR 0xFE, SCR 0x0030, FSR 0x0060, FCR 0, FDR 0, SPTR 0x0001, LSR 0, SEMR 0x30, FTCR 0x1F1F, BRR 0x1A
    citation: EVK-R20-R26; BRR from TF-A scifa.S:143-148 @ f59ed5a31 (I)
  - id: S13
    kind: qtest
    test: /aarch64/rzv2l-smarc/scif/ftdr-clears-tend
    proves: an FTDR write clears TEND at once
    golden: TEND 1 before, 0 right after the write
    citation: 22.2.7 p.1281
  - id: S14
    kind: qtest
    test: /aarch64/rzv2l-smarc/scif/tend-te-cleared
    proves: TEND needs an empty TX FIFO, not just an idle shift register; with TE cleared over a queued byte it stays 0
    golden: after two frames FDR.T 1 and TEND 0
    citation: 22.2.7 p.1281 (setting condition); review 2026-10-29 R1
  - id: S15
    kind: qtest
    test: /aarch64/rzv2l-smarc/scif/tx-7bit
    proves: a 7-bit frame does not carry FTDR bit 7; an 8-bit frame does
    golden: 0xC1 looped back reads 0xC1 in 8N1 and 0x41 in 7E2
    citation: 22.2.5 p.1274 note 3; review 2026-10-29 R3
  - id: X01
    kind: qtest
    test: /aarch64/rzv2l-smarc/scif/smr-mask
    proves: SMR reserved bits (15-8, 2) read 0
    golden: 0xFF7F written reads 0x007B
    citation: 22.2.5 p.1274
  - id: X02
    kind: qtest
    test: /aarch64/rzv2l-smarc/scif/rx-chardev
    proves: bytes from the serial line reach FRDR in order
    golden: '"xyz" in, FDR.R 3, RDF 1, FRDR x, y, z'
    citation: 22.2.2, 22.2.11 p.1292
  - id: X03
    kind: qtest
    test: /aarch64/rzv2l-smarc/scif/rx-overrun
    proves: a byte that finds the RX FIFO full is lost and sets ORER, which clears only after a 1-read
    golden: FDR.R 16; LSR 0x0001 after an unread 0-write; 0 after read and 0-write
    citation: 22.2.13 p.1296
  - id: X04
    kind: qtest
    test: /aarch64/rzv2l-smarc/scif/rx-disabled
    proves: with RE = 0 the receiver ignores the line
    golden: FDR.R 0
    citation: 22.2.6 p.1276
  - id: X05
    kind: qtest
    test: /aarch64/rzv2l-smarc/scif/rx-stopped-by-orer
    proves: while ORER is set the receiver drops bytes even with FIFO space; clearing ORER restarts it
    golden: FDR.R 15 after one pop and one more byte; LSR 0x0001; FDR.R 16 after the clear and one byte
    citation: 22.2.13 p.1296; 22.4.2 (overrun check before a byte is stored); review 2026-10-29 R2

  - id: A01
    kind: acceptance
    run: tests/acceptance/m2/run.sh
    pass: '^M2 ACCEPTANCE: PASS$'
    proves: the hello probe's greeting arrives on the serial line exactly (stderr never counts)
    golden: '''Hello from RZ/V2L'' CR LF, byte for byte'
    citation: REQ-TEST-001; TF-A scifa.S:188-222 (CR before LF)
  - id: A02
    kind: acceptance
    run: tests/acceptance/m2/run.sh
    pass: '^M2 ACCEPTANCE: PASS$'
    proves: TF-A's flush (poll TEND after clearing it right after the FTDR write) finishes; a model that completes the transmission inside the write makes it time out (exit 2), not hang
    golden: probe exit 0
    citation: scif.md section 7; TF-A scifa.S:237-256 @ f59ed5a31
  - id: A03
    kind: acceptance
    run: tests/acceptance/m2/run.sh
    pass: '^M2 ACCEPTANCE: PASS$'
    proves: SCIF0 TXI reaches the CPU through the GIC as INTID 415
    golden: INTID 415 = 32 + SPI 383
    citation: device map (SCIF0 row); DTB-U interrupts
  - id: A04
    kind: acceptance
    run: tests/acceptance/m2/run.sh
    pass: '^M2 ACCEPTANCE: PASS$'
    proves: info mtree / info qtree show the five SCIF windows exactly as the device map, and the M1 lines unchanged
    golden: tests/acceptance/m1/expected/mtree.txt, qtree.txt
    citation: device map SCIF0, SCIF2, SCIF1/3/4 rows
  - id: A05
    kind: acceptance
    run: tests/acceptance/m2/run.sh
    pass: '^M2 ACCEPTANCE: PASS$'
    proves: the probe run's -d unimp,guest_errors,invalid_mem log holds only the allow-listed lines
    golden: tests/acceptance/m2/expected/log-allow.txt
    citation: REQ-TEST-003
  - id: A06
    kind: acceptance
    run: tests/acceptance/m2/run.sh
    pass: '^M2 ACCEPTANCE: PASS$'
    proves: the SMR write that selects clock synchronous mode makes the CPU take a synchronous external abort
    golden: ESR.EC 0x25, DFSC 0x10
    citation: spec decision (c) B; Arm ESR_EL1 encoding

  - id: L02
    kind: acceptance
    run: tests/acceptance/m2/run.sh
    pass: '^M2 ACCEPTANCE: PASS$'
    proves: the unmodified G0 v6.12.59 kernel with DTB-U prints its banner and the earlycon line on SCIF0
    golden: '"Linux version 6.12.59" and "earlycon: scif0 at MMIO 0x000000001004b800 (options ''115200n8'')", the line the EVK prints'
    citation: docs/evidence/EVK-2026-10-08-boot-log.md; scif.md section 5; L01 (.config) in docs/units/M2-first-character/first-blocker.md


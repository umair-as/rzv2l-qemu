# The M1 skeleton probe on the project's QEMU build.
# M1 has no UART: the probe reports through semihosting, which the bench
# routes to the console. QEMU exits with the probe's status (0 = pass).
name = "rzv2l-smarc · M1 probe"
description = "M1 skeleton probe (CPU IDs, CNTFRQ, PSCI, aborts). Output via semihosting; QEMU exits with the result."
qemu = "build/qemu/qemu-system-aarch64"
prepare = ["make", "-s", "-C", "tests/probes/m1-skeleton"]
args = ["-M", "rzv2l-smarc", "-kernel", "tests/probes/m1-skeleton/out/probe.Image"]
semihosting = true
log = "unimp,guest_errors,invalid_mem"
